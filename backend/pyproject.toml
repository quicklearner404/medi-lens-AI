[project]
name = "medilens"
version = "0.1.0"
description = "Backend for MediLens: reads prescriptions and explains each medicine using official drug information."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["medilens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.package-data]
medilens = ["data/*.json"]
