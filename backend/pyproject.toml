[project]
name = "medilens"
version = "0.1.0"
description = "Backend for MediLens: reads prescriptions and explains each medicine using official drug information."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["medilens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
